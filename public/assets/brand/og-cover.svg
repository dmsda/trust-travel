<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#F0EEEA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#171614" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Delicate architectural frame / border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#E5E1DA" stroke-width="1.5"/>

  <!-- Logo Group -->
  <g transform="translate(100, 100)">
    <!-- Sunburst Icon -->
    <g transform="translate(0, 0) scale(1.4)">
      <path d="M14 0L15.8 11.5L28 14L15.8 16.5L14 28L12.2 16.5L0 14L12.2 11.5L14 0Z" fill="#B9A17D" />
      <path d="M14 4.5L15.2 12.8L23.5 14L15.2 15.2L14 23.5L12.8 15.2L4.5 14L12.8 12.8L14 4.5Z" fill="#171614" opacity="0.6" />
      <circle cx="14" cy="14" r="2.8" fill="#FAF9F6" />
      <circle cx="14" cy="14" r="1.5" fill="#B9A17D" />
    </g>
    <!-- Brand Name -->
    <text x="56" y="28" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#171614">TRUST<tspan fill="#B9A17D">.</tspan>TRAVEL</text>
  </g>

  <!-- Tagline & Heading -->
  <g transform="translate(100, 240)">
    <text font-family="Georgia, 'Cormorant Garamond', serif" font-size="64" font-weight="500" fill="#171614" letter-spacing="-1">
      <tspan x="0" y="0">Effortless bookings</tspan>
      <tspan x="0" y="76">for </tspan>
      <tspan fill="#B9A17D" font-style="italic">leisure </tspan>
      <tspan>travel or </tspan>
      <tspan fill="#B9A17D" font-style="italic">business</tspan>
    </text>

    <text x="0" y="160" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="22" fill="#77736E" font-weight="400">
      Discover extraordinary stays, unique cultural experiences, and seamless transfers.
    </text>
  </g>

  <!-- Curated badges / Pills -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1" filter="url(#shadow)"/>
    <text x="80" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="middle">Luxury Stays</text>

    <rect x="180" y="0" width="180" height="44" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1" filter="url(#shadow)"/>
    <text x="270" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="middle">Private Transfers</text>

    <rect x="380" y="0" width="190" height="44" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1" filter="url(#shadow)"/>
    <text x="475" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="middle">Curated Leisure</text>
  </g>

  <!-- Editorial compass watermark on right -->
  <g transform="translate(900, 315) scale(6)" opacity="0.12">
    <path d="M14 0L15.8 11.5L28 14L15.8 16.5L14 28L12.2 16.5L0 14L12.2 11.5L14 0Z" fill="#171614" />
  </g>
</svg>
